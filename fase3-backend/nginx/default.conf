resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/v1/productos {
        set $destino http://productos-service:8081;
        proxy_pass $destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/categorias {
        set $destino http://productos-service:8081;
        proxy_pass $destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/auth {
        set $destino http://auth-service:8082;
        proxy_pass $destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/usuarios {
        set $destino http://auth-service:8082;
        proxy_pass $destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/boletas {
        set $destino http://ventas-service:8083;
        proxy_pass $destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
