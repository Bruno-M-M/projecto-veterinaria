spring.application.name=ventas-service
server.port=8083

# Clean JDBC URL without query params
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICIO}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pass TNS_ADMIN as a driver connection property
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${WALLET_DIR}

spring.jpa.hibernate.ddl-auto=update

# URL de productos-service (en docker-compose: http://productos-service:8081)
productos.url=${PRODUCTOS_URL:http://localhost:8081}

# Seguridad: misma clave que auth-service y productos-service
jwt.secret=${JWT_SECRET}
cors.origins=${CORS_ORIGINS:http://localhost:5173}