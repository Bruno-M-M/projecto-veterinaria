spring.application.name=ventas-service
server.port=8083

# Clean JDBC URL without query params
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICIO}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pass TNS_ADMIN as a driver connection property
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${WALLET_DIR}

spring.jpa.hibernate.ddl-auto=update