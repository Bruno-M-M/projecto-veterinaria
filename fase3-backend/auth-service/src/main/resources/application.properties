spring.application.name=auth-service
server.port=8082

spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICIO}?TNS_ADMIN=${WALLET_DIR}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.access-minutos=30
jwt.refresh-dias=7

cors.origins=${CORS_ORIGINS:http://localhost:5173}

admin.run=${ADMIN_RUN:11111111-1}
admin.correo=${ADMIN_CORREO:}
admin.clave=${ADMIN_CLAVE:}